<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Yellow accent block -->
  <rect x="0" y="0" width="400" height="630" fill="#FFEB00"/>
  
  <!-- Black border -->
  <rect x="390" y="0" width="10" height="630" fill="#000000"/>
  
  <!-- Main title area -->
  <rect x="450" y="150" width="700" height="200" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  
  <!-- Shadow effect -->
  <rect x="460" y="160" width="700" height="200" fill="#000000"/>
  <rect x="450" y="150" width="700" height="200" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  
  <!-- Text -->
  <text x="800" y="230" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="#000000">NEO-BRUTALISM</text>
  <text x="800" y="290" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#000000">EXPOSED STRUCTURE</text>
  
  <!-- Accent squares -->
  <rect x="50" y="50" width="100" height="100" fill="#000000"/>
  <rect x="200" y="200" width="80" height="80" fill="#A300FF"/>
  <rect x="100" y="450" width="120" height="120" fill="#0050FF"/>
</svg>
